<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darts Rankings</title>
<meta name="theme-color" content="#1f4d3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏆%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf6ee;--card:#fffdf8;--ink:#22201c;--muted:#7a7467;--line:#e8e0d0;--green:#1f4d3a;--green-soft:#e7efe9;--gold:#b8893b;--gold-soft:#f5ecd6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--gold-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{padding:64px 0 36px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf8,var(--paper))}
.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600}
h1{font:700 clamp(38px,7vw,64px)/1.05 "Cormorant Garamond",Georgia,serif;margin:10px 0 12px;color:var(--green)}
.sub{color:var(--muted);max-width:520px;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:32px 0 24px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 20px;border-radius:999px;font:500 14px Inter,sans-serif;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fffdf8}
select{font:500 14px Inter,sans-serif;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.card,.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(60,45,20,.04),0 14px 30px -20px rgba(60,45,20,.3)}
.card{padding:22px}
.card.r1{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card))}
.place{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.name{font:700 28px "Cormorant Garamond",Georgia,serif;margin:6px 0 10px}
.val{font-size:36px;font-weight:600;color:var(--green);line-height:1}
.lab{font-size:13px;color:var(--muted);margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th{text-align:left;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:16px 20px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbf6ea}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:600;font-size:14px}
.chip.r1{background:var(--gold);color:#fffdf8}
.chip.r2{background:#d9d4c7;color:var(--ink)}
.chip.r3{background:#e4c9a6;color:#5b3d17}
.msg{padding:40px;text-align:center;color:var(--muted)}
.pcard{text-align: left; font:inherit;color:inherit;cursor:pointer;width:100%;transition:.2s}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.form{display:flex;gap:6px;margin-top:14px}
.pname{font:700 clamp(32px,6vw,48px)/1.1 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:6px 0 20px}
.back{margin-bottom:20px}
.formcard{margin-bottom:28px}
.picker{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px}
.picker{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
.picker select{width:100%}
.vs{font:700 22px "Cormorant Garamond", Georgia,serif;color:var(--gold);padding-bottom:10px}
.sect{margin:28px 0 12px;font:700 24px "Cormorant Garamond",Georgia,serif;color:var(--green)}
.toolbar{display: flex; justify-content: flex-end; margin-bottom: 16px}
.copybtn{font: 600 14px Inter, system-ui, sans-serif;padding:11px 22px;border-radius:999px;border:1px solid var(--gold);background:(--gold-soft);color:var(--green);cursor:pointer;transition: .2s;}
.copybtn:hover{background:var(--gold);color:#fffdf8}
.search{display:block;width:100%;max-width:380px;font:500 15px Inter,system-ui,sans-serif;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:22px}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--gold)}
footer{padding:36px 0 56px;color:var(--muted);font-size:13px}
@media (max-width: 640px) {
  .wrap{padding:0 16px}
  header{padding:40px 0 24px}
  nav{gap:6px;margin:22px 0 18px}
  .tab{padding:9px 16px; font-size:13px}
  select{width:100%}
  .podium{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .card{padding:16px}
  .name{font-size:24px}
  .val{font-size:28px}
  table{min-width:360px}
  th,td{padding:12px 14px}
  .toolbar{justify-content:stretch}
  .copybtn{width:100%}
  .search{max-width:none}
}
@media (hover:none){
  .pcard:hover{transform:none}
}
@media print{
  body{background:#fff}
  header{background:none;padding:0 0 16px}
  nav,.toolbar,.search,.back,footer{display:none}
  card,.table-wrap{box-shadow:none;break-inside:avoid}
  .table-wrap{overflow:visible}
  tbody tr:hover{background:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">League standings</div>
  <h1>Darts Rankings</h1>
  <p class="sub">Season table, overall totals and every event. Tied players share a rank.</p>
</div></header>
<main class="wrap">
  <nav id="nav"></nav>
  <div id="main"><div class="msg">Loading…</div></div>
</main>
<footer><div class="wrap">Built from leaderboard.json by the darts-ranking engine.</div></footer>
<script>
const $ = (s) => document.querySelector(s);
const state = { data: null, view: "season", event: 0, player: null, query: " ", compareA: null, compareB: null };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const views = {
  season: {
    label: "Season",
    rows: () => state.data.season,
    valueKey: "seasonPoints",
    valueLabel: "season points",
    cols: [["Rank", "rank"], ["Player", "player"], ["Season pts", "seasonPoints", 1], ["Wins", "wins", 1], ["Events", "events", 1]]
  },
  overall: {
    label: "Overall",
    rows: () => state.data.overall,
    valueKey: "points",
    valueLabel: "points",
    cols: [["Rank", "rank"], ["Player", "player"], ["Points", "points", 1], ["Legs won", "legsWon", 1]]
  },
  events: {
    label: "By event",
    rows: () => (state.data.events[state.event] || { standings: [] }).standings,
    valueKey: "points",
    valueLabel: "points",
    cols: [["Rank", "rank"], ["Player", "player"], ["Points", "points", 1], ["Legs won", "legsWon", 1]]
  },
  players: {label: "Players"},
  compare: {label: "Compare"}
};

function whatsappText(rows, key, title) {
  const groups = new Map();
  rows.forEach((r) => {
    const g = groups.get(r.rank) || [];
    g.push(r);
    groups.set(r.rank, g);
  });
  const lines = [...groups].map(
    ([rank, list]) =>
    "*" + rank + ".* " + list.map((p) => p.player).join(" / ") + " - " + list[0][key] + " pts" 
   );
   return ["*" + title + "*", "", ...lines].join("\n");
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.append(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommmand("copy"); } catch { /* clipboard unavailable */}
      ta.remove();
      return ok;
    }
  }
function buildNav() {
  const nav = $("#nav");
  nav.replaceChildren();
  for (const [key, v] of Object.entries(views)) {
    const b = el("button", "tab", v.label);
    b.setAttribute("aria-pressed", String(state.view === key));
    b.onclick = () => { state.view = key; state.player = null; buildNav(); render(); };
    nav.append(b);
  }
  if (state.view === "events" && state.data.events.length) {
    const sel = el("select");
    state.data.events.forEach((e, i) => {
      const o = el("option", "", e.name);
      o.value = i;
      sel.append(o);
    });
    sel.value = state.event;
    sel.onchange = () => { state.event = Number(sel.value); render(); };
    nav.append(sel);
  }
}

function render() {
  if (state.view === "players") { renderPlayers(); return; }
  if (state.view === "compare") { renderCompare(); return; }
  const v = views[state.view];
  const rows = v.rows();
  const main = $("#main");
  main.replaceChildren();
  if (!rows.length) { main.append(el("div", "msg", "No results yet.")); return; }

  const title = 
  "DARTS RANKING - " + 
  (state.view === "season"
    ? "SEASON"
    : state.view === "overall"
    ? "OVERALL"
    : state.data.events[state.event].name);

  const bar = el("div" , "toolbar");
  const copy = el("button", "copybtn", "Copy for WhatsApp");
  copy.onclick = async () => {
    const ok = await copyText(whatsappText(rows, v.valueKey, title));
    copy.textContent = ok ? "Copied✔" : "copy failed";
    setTimeout (() => { copy.textContent = "Copy for whatApp"; }, 2000);
  };
  bar.append(copy);

  
  const pod = el("section", "podium");
  rows.slice(0, 3).forEach((r) => {
    const c = el("article", "card r" + r.rank);
    c.append(
      el("div", "place", "Rank " + r.rank),
      el("div", "name", r.player),
      el("div", "val", String(r[v.valueKey])),
      el("div", "lab", v.valueLabel)
    );
    pod.append(c);
  });

  const wrap = el("div", "table-wrap");
  const t = el("table");
  const head = el("tr");
  v.cols.forEach(([label, , num]) => head.append(el("th", num ? "num" : "", label)));
  const thead = el("thead");
  thead.append(head);
  t.append(thead);

  const body = el("tbody");
  rows.forEach((r) => {
    const tr = el("tr");
    v.cols.forEach(([, key, num]) => {
      const td = el("td", num ? "num" : "");
      if (key === "rank") td.append(el("span", "chip r" + r.rank, String(r.rank)));
      else td.textContent = String(r[key]);
      tr.append(td);
    });
    body.append(tr);
  });
  t.append(body);
  wrap.append(t);
  main.append(bar,pod, wrap);
}

function formChips(form) {
  const row = el("div", "form");
  form.forEach((r) => row.append(el("span", "chip r" + r, String(r))));
  return row;
}

function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  return e;
}

function progressChart(results) {
  let run = 0;
  const pts = results.map((r) => {
    run += r.seasonPoints;
    return { event: r.event, total: run};
  });

  const W = 640, H = 240, L = 44, R = 24, T = 20, B = 44;
  const max = Math.max(10, ...pts.map((p) => p.total));
  const x = (i) =>
     pts.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1);
  const y = (V) => T + (1 - V / max) * (H - T - B);

  const svg = svgEl("svg", {
    viewBox: "0 0 " + W + " " + H,
    role: "img",
    "aria-label": "Season points after each event"
  });
  svg.style.width = "100%";
  svg.style.heigth = "auto";

  for (let i = 0; i <= 4; i++) {
    const v = Math.round((max * i) / 4);
    const gy = y(v);
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: gy, y2: gy, stroke: "#e8e0do"}));
    const t = svgEl("text", { x: L - 8, y: gy + 4, "text-anchor": "end", "font-size": "11", fill: "#7a7467"});
    t.textContent = String(v);
    svg.append(t);
  }

  svg.append(svgEl("polyline", {
    points: pts.map((p, i) => x(i) + "," + y(p.total)).join(" "),
    fill: "none",
    stroke: "#1f4d3a",
    "stroke-width": "3",
    "stroke-linejoin": "round",
    "stroke-linecap": "round"
  }));

  pts.forEach((p, i) => {
    const dot = svgEl("circle", { cx: x(i), cy: y(p.total), r: 6, fill: "#b8893b", stroke: "#fffdf8", "stroke-width": 2 });
    const tip = svgEl("title");
    tip.textContent = p.event + ": " + p.total + " season points";
    dot.append(tip);
    svg.append(dot);

    const lab = svgEl("text", { x: x(i), y: H - 18, "text-anchor": "middle", "font-size": "11", fill: "#7a7467" });
    lab.textContent = p.event.length > 12 ? p.event.slice(0, 11) + "…" : p.event;
    svg.append(lab);
  });

  return svg;
}


function renderPlayers() {
  const main = $("#main");
  main.replaceChildren();
  const profiles = state.data.profiles || [];
  if (!profiles.length) {
    main.append(el("div", "msg", "No profiles yet. Run the export again"));
    return;
  }
  const p = profiles.find((x) => x.player === state.player);
  if (p) { renderProfile(p); return; }

  const search = el("input", "search");
  search.type = "text";
  search.placeholder = "Search players";
  search.setAttribute("aria-label", "Search players");
  search.value = state.query;

  const grid = el("section", "podium");

  function draw() {
    const q = state.query.trim().toLowerCase();
    const shown = profiles.filter((pr) => pr.player.toLowerCase().includes(q));
    grid.replaceChildren();
    if (!shown.length) {
      grid.append(el("div", "msg", "No players match ″" + state.query.trim() + "″․"));
      return;
    }
    shown.forEach((pr) => {
      const c = el("button", "card pcard");
      c.append(
        el("div", "name", pr.player),
        el("div", "val", String(pr.seasonPoints)),
        el("div", "lab", "season points · " + pr.events + "events"),
        formChips(pr.form)
      );
      c.onclick = () => { state.play = pr.player; render(); window.scrollTo(0, 0); };
      grid.append(c);
    });
  }

  search.oninput = () => { state.query = search.value; draw(); };
  draw();
  main.append(search, grid);
}

function renderProfile(p) {
  const main = $("#main");
  const back = el("button", "tab back", "← All players");
  back.onclick = () => { state.player = null; render(); };

  const stats = el("section", "podium");
  [
    ["Season points", p.seasonPoints],
    ["Wins", p.wins],
    ["Podiums", p.podiums],
    ["Best finish", p.bestRank],
    ["Average finish", p.averageRank],
    ["Events", p.events]
  ].forEach(([label, val]) => {
    const c = el("article", "card");
    c.append(el("div", "val", String(val)), el("div", "lab", label));
    stats.append(c)
  });

  const formCard = el("div", "card formcard");
  formCard.append(
    el("div", "place", "Recent form"),
    formChips(p.form),
    el("div", "lab", "Finishing placein the last " + p.form.length + " events, oldest first")
  );

  const wrap = el("div", "table-wrap");
  const t = el("table");
  const head = el("tr");
  [["Event", 0], ["place", 0], ["Points", 1], ["Legs", 1], ["Season pts", 1]].forEach(
    ([label, num]) => head.append(el("th", num ? "num" : "", label))
  );
  const thead = el("thead");
  thead.append(head);
  const body = el("tbody");
  p.results.forEach((r) => {
    const tr = el("tr");
    const place = el("td");
    place.append(el("span", "chip r" + r.rank, String(r.rank)));
    tr.append(
      el("td", "", r.event),
      place,
      el("td", "num", String(r.points)),
      el("td", "num", String(r.legsWon)),
      el("td", "num", String(r.seasonPoints))
    );
    body.append(tr);
  });
  t.append(thead, body);
  wrap.append(t);

  const title = el("div");
  title.append(el("div", "eyebrow", "Player profile"), el("h2", "pname", p.player));
  const chartCard = el("div", "card formcard");
  chartCard.append(
    el("div", "place", "Season points proggression"),
    progressChart(p.results)
  );
  main.replaceChildren(back, title, stats, formCard, wrap);
}

function renderCompare() {
  const main = $("#main");
  main.replaceChildren();
  const profiles = state.data.profiles || [];
  if (profiles.length < 2) {
    main.append(el("div", "msg", "Two players are needed to compare."));
    return;
  }

  const has = (n) => profiles.some((p) => p.player === n);
  if (!has(state.compareA)) state.compareA = profiles[0].player;
  if (!has(state.compareB) || state.compareB === state.compareA) {
    state.compareB = profiles.find((p) => p.player !== state.compareA).player;
  }

  function picker(label, key) {
    const box = el("label", "picker");
    box.append(el("span", "lab", label));
    const sel = el("select");
    profiles.forEach((p) => {
      const o = el("option", "", p.player);
      o.value = p.player;
      sel.append(o);
    });
    sel.value = state[key];
    sel.onchange = () => { state[key] = sel.value; render(); }
    box.append(sel);
    return box;
  }

  const bar = el("div", "pickers");
  bar.append(picker("player A", "compareA"), el("span", "vs", "vs"), picker("player B", "compareB"));
  main.append(bar);

  const a = profiles.find((p) => p.player === state.compareA);
  const b = profiles.find((p) => p.player === state.compareB);

  const meetings = [];
  a.results.forEach((ra) => {
    const rb = b.results.find((r) => r.event === ra.event);
    if (rb) meetings.push({ event: ra.event, ra: ra.rank, rb: rb.rank });
  });
  const winsA = meetings.filter((m) => m.ra < m.rb).length;
  const winsB = meetings.filter((m) => m.rb < m.ra).length;
  const ties = meetings.length - winsA - winsB;

const cards = el("section", "podium");
[[a.player, winsA, winsA > winB], ["Tied", ties, false], [b.player, winsB, winsB > winsA]].forEach(
  ([name, n, lead]) => {
    const c = el("article", "card" + (lead ? " r1" : ""));
    c.append(el("div", "name", name), el("div", "val", String(n)), el("div", "lab", n === 1 ? "event" : "events"));
    cards.append(c);
  }
);
main.append(cards);

  if (!meetings.length) {
    main.append(el("div", "msg", a.player + " and " + b.player + " have not met in an events yet."));
  } else {
    const wrap = el("div", "table-wrap");
    const t = el("table");
    const head = el("tr");
    ["Event", a.player, b.player, "Better finish"].forEach((h) => head.append(el("th", "", h)));
    const thead = el("thead");
    thead.append(head);
    const body = el("tbody");
    meetings.forEach((m) => {
      const tr = el("tr");
      const ca = el("td");
      ca.append(el("span", "chip r" + m.ra, String(m.ra)));
      const cb = el("td");
      cb.append(el("span", "chip r" + m.rb, String(m.rb)));
      tr.append(
        el("td", "", m.event),
        ca,
        cb,
        el("td", "", m.ra < m.rb ? a.player : m.rb < m.ra ? b.player : "Tied")
      );
      body.append(tr)
    });
    t.append(thead, body);
    wrap.append(t);
    main.append(el("h3", "sect", "Shared events"), wrap);
  }

  const glance = el("div", "table-wrap");
  const gt = el("table");
  const gh = el("tr");
  ["", a.player, b.player].forEach((h) => gh.append(el("th", "", h)));
  const gthead = el("thead");
  gthead.append(gh);
  const gbody = el("tbody");
  [
    ["Season points", "seasonPoints"],
    ["Wins", "wins"],
    ["Podiums", "podiums"],
    ["Best finish", "bestRank"],
    ["Average finish", "averageRank"],
    ["Events played", "events"]
  ].forEach(([label, key]) => {
    const tr = el("tr");
    tr.append(el("td", "", label), el("td", "", String(a[key])), el("td", "", String(b[key])));
    gbody.append(tr);
  });
  gt.append(gthead, gbody);
  glance.append(gt);
  main.append(el("h3", "sect", "Season at a glance"), glance);

}

fetch("leaderboard.json")
  .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
  .then((d) => { state.data = d; buildNav(); render(); })
  .catch(() => {
    $("#main").replaceChildren(el("div", "msg", "Couldn’t load leaderboard.json. Run the export first, then serve this folder."));
  });
</script>
</body>
</html>
